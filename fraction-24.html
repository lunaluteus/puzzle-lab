<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分数 24 点</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f9f7ed;
    --ink: #223d34;
    --muted: #53675d;
    --line: #d5dcd1;
    --felt: #1d493e;
    --accent: #a94331;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    background: #e9eee3;
    font-family: system-ui, sans-serif;
    line-height: 1.55;
  }
  main { width: min(100% - 32px, 704px); margin: 0 auto; padding: 42px 0; }
  header nav { margin-bottom: 12px; font-size: .9rem; }
  header a { color: var(--muted); text-underline-offset: .2em; }
  h1 { margin: 0; font-size: clamp(2.2rem, 8vw, 4.4rem); line-height: 1.1; letter-spacing: -.05em; }
  header p { margin: 12px 0 24px; color: var(--muted); }
  label { font-size: .875rem; }
  select, button { font: inherit; color: inherit; }
  button, select { touch-action: manipulation; }
  header a:focus-visible, button:focus-visible, select:focus-visible { outline: 3px solid #c57231; outline-offset: 3px; }
  .navigation, .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .navigation { margin-bottom: 10px; justify-content: space-between; color: var(--muted); }
  select, .actions button {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 8px 12px;
    border-radius: 9px;
  }
  button:not(:disabled) { cursor: pointer; }
  button:disabled { opacity: .48; }
  .table {
    background: var(--felt);
    border: 1px solid #14372d;
    border-radius: 18px;
    box-shadow: 0 12px 26px #163f3424;
    padding: clamp(12px, 4vw, 28px);
    color: var(--paper);
  }
  .cards { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: clamp(6px, 2vw, 14px); }
  .card {
    position: relative;
    background: var(--paper);
    color: var(--ink);
    display: grid;
    min-width: 0;
    min-height: 90px;
    height: clamp(90px, 24vw, 144px);
    place-content: center;
    padding: 6px 2px;
    border: 2px solid transparent;
    border-radius: 11px;
    font: 700 clamp(1rem, 5vw, 2.7rem)/1.1 Georgia, serif;
    font-variant-numeric: tabular-nums;
  }
  .card[hidden] { display: none; }
  .card:not(:disabled):hover { background: #fffdf5; }
  .card[aria-pressed="true"] { border-color: #e6b66e; background: #fff1cf; }
  .card .suit, .card .order { position: absolute; top: 7px; font: 700 .85rem/1 system-ui, sans-serif; }
  .card .suit { left: 8px; }
  .card .order { right: 8px; color: var(--accent); }
  .suit.red { color: var(--accent); }
  .operators { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 8px; margin-top: 16px; }
  .operators button {
    color: var(--paper);
    background: #ffffff0d;
    border: 1px solid #ffffff60;
    border-radius: 8px;
    min-height: 42px;
    font: 700 1.3rem Georgia, serif;
  }
  .operators button:not(:disabled):hover, .operators button.hinted { background: var(--paper); color: var(--ink); }
  #status { margin: 14px 0 0; min-height: 24px; }
  #solution { margin: 10px 0 0; color: #dce7dc; overflow-wrap: anywhere; }
  #steps { margin: 10px 0 0; padding-left: 1.5em; color: #dce7dc; overflow-wrap: anywhere; }
  #steps:empty { display: none; }
  .actions { margin-top: 16px; }
  .actions #next { margin-inline-start: auto; background: var(--felt); color: var(--paper); border-color: var(--felt); }
  @media (max-width: 460px) {
    main { padding-top: 28px; }
    header p { margin-bottom: 18px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <nav aria-label="谜题导航"><a href="index.html">回谜题桌</a></nav>
    <h1>分数 24 点</h1>
    <p>按顺序选两张牌，再选一个运算。最后只剩一张 24 就过关。这 16 题都要用到分数。</p>
  </header>
  <div class="navigation">
    <label>题目 <select id="puzzle" aria-label="题目"></select></label>
    <span id="progress"></span>
  </div>
  <section class="table" aria-label="牌桌">
    <div class="cards" id="cards"></div>
    <div class="operators" id="operators" aria-label="运算"></div>
    <p id="status" role="status"></p>
    <p id="solution" hidden><strong>完整算式</strong> <span id="solution-expression"></span></p>
    <ol id="steps" aria-label="计算步骤"></ol>
  </section>
  <div class="actions">
    <button id="hint" type="button">提示一步</button>
    <button id="undo" type="button">撤销</button>
    <button id="reset" type="button">重来</button>
    <button id="next" type="button">下一题</button>
  </div>
</main>
<script id="fraction-24-rules">
const puzzles = [
  [1,3,4,6],
  [1,4,5,6],
  [1,5,5,5],
  [1,6,6,8],
  [1,8,12,12],
  [2,2,11,11],
  [2,2,13,13],
  [2,3,5,12],
  [2,4,10,10],
  [2,5,5,10],
  [2,7,7,10],
  [3,3,7,7],
  [3,3,8,8],
  [4,4,7,7],
  [5,5,7,11],
  [5,7,7,11]
];
const signs = ["+", "−", "×", "÷"];

function fraction(n, d) {
  if (d === 0) return null;
  let a = Math.abs(n), b = Math.abs(d);
  while (b !== 0) [a, b] = [b, a % b];
  const divisor = d < 0 ? -a : a;
  return { n: n / divisor, d: d / divisor };
}

function calculate(left, right, op) {
  const { n: a, d: b } = left;
  const { n: c, d } = right;
  switch (op) {
    case 0: return fraction(a * d + b * c, b * d);
    case 1: return fraction(a * d - b * c, b * d);
    case 2: return fraction(a * c, b * d);
    case 3: return fraction(a * d, b * c);
  }
}

function value(tile) {
  return tile.d === 1 ? String(tile.n) : tile.n + "/" + tile.d;
}

function isGoal(tile) {
  return tile.n === 24 && tile.d === 1;
}

function merge(items, left, right, result) {
  return [...items.filter((_, index) => index !== left && index !== right), result];
}

function suggestion(items) {
  if (items.length === 1) return isGoal(items[0]) ? true : null;
  for (let left = 0; left < items.length; left++) {
    for (let right = 0; right < items.length; right++) {
      if (left === right) continue;
      for (let op = 0; op < signs.length; op++) {
        if (left > right && (op === 0 || op === 2)) continue;
        const result = calculate(items[left], items[right], op);
        if (result && suggestion(merge(items, left, right, result))) {
          return { left, right, op };
        }
      }
    }
  }
  return null;
}

function undoCountToSolution(previousBoards) {
  for (let index = previousBoards.length - 1; index >= 0; index--) {
    if (suggestion(previousBoards[index])) return previousBoards.length - index;
  }
  return null;
}
</script>
<script>
const names = ["加", "减", "乘", "除"];
const suits = ["♠", "♥", "♣", "♦"];
const $ = id => document.getElementById(id);
// Key each deck independently so two tabs can save different puzzles at once.
const progressKeys = puzzles.map(deck => "puzzle-lab:fraction-24:solved:" + [...deck].sort((a, b) => a - b).join("-"));
const solved = new Set();
let progressStorage;
try {
  progressStorage = window.localStorage;
  progressKeys.forEach((key, index) => {
    if (progressStorage.getItem(key) === "1") solved.add(index);
  });
} catch {
  // Progress remains available for the current page when storage is blocked.
}
const prompt = "选两张牌开始。减法和除法按选择顺序算。";
let puzzleIndex = 0;
let tiles, selection, history, steps, hintedOperator, message;

function operationText(left, right, op) {
  return `${value(tiles[left])} ${signs[op]} ${value(tiles[right])}`;
}

function operandExpression(tile) {
  return tile.expression ? `(${tile.expression})` : value(tile);
}

function recordMove(left, right, op, result) {
  const expression = operationText(left, right, op) + " = " + value(result);
  const combinedExpression = `${operandExpression(tiles[left])} ${signs[op]} ${operandExpression(tiles[right])}`;
  history.push(tiles);
  steps.push({left, right, op, expression});
  tiles = merge(tiles, left, right, {...result, expression: combinedExpression});
  return expression;
}

function resultMessage(result, expression) {
  if (tiles.length > 1) return expression + "。继续选牌。";
  if (!isGoal(result)) return "最后得到 " + value(result) + "。可以撤销一步接着试。";
  return solved.size === puzzles.length ? "凑成 24！16 题全部过关。" : "凑成 24！过关。";
}

function selectTile(index) {
  if (selection.includes(index)) {
    selection = selection.filter(i => i !== index);
  } else if (selection.length < 2) {
    selection = [...selection, index];
  } else {
    selection = [selection[0], index];
  }
  hintedOperator = null;
  const [left, right] = selection.map(i => value(tiles[i]));
  message = selection.length === 2
    ? `先选 ${left}，再选 ${right}。请选择运算。`
    : selection.length ? `先选了 ${left}。再选一张牌。` : prompt;
  render();
}

function apply(op) {
  if (selection.length !== 2) return;
  const [left, right] = selection;
  const result = calculate(tiles[left], tiles[right], op);
  if (!result) {
    message = "不能除以零。试试别的运算或换一张牌。";
    render();
    return;
  }
  const expression = recordMove(left, right, op, result);
  selection = [];
  hintedOperator = null;
  if (tiles.length === 1 && isGoal(result)) {
    solved.add(puzzleIndex);
    try {
      progressStorage?.setItem(progressKeys[puzzleIndex], "1");
    } catch {
      // The completed puzzle still counts for the current page.
    }
    renderProgress();
  }
  message = resultMessage(result, expression);
  saveAttempt();
  render();
  if (tiles.length > 1) {
    cardButtons[0].focus();
  } else {
    $(isGoal(result) ? "next" : "undo").focus();
  }
}

function reset(index, savedMoves = []) {
  puzzleIndex = index;
  tiles = puzzles[index].map((rank, i) => ({ n: rank, d: 1, suit: i }));
  selection = [];
  history = [];
  steps = [];
  hintedOperator = null;
  message = prompt;
  for (const move of savedMoves) {
    const {left, right, op} = move ?? {};
    if (!Number.isInteger(left) || !Number.isInteger(right) || !Number.isInteger(op)
      || left === right || !tiles[left] || !tiles[right] || !signs[op]) return reset(index);
    const result = calculate(tiles[left], tiles[right], op);
    if (!result) return reset(index);
    recordMove(left, right, op, result);
  }
  if (steps.length) {
    message = tiles.length === 1 ? resultMessage(tiles[0]) : "已恢复上次进度。";
  }
  saveAttempt();
  render();
}

function saveAttempt() {
  const url = new URL(location.href);
  if (puzzleIndex === 0) url.searchParams.delete("puzzle");
  else url.searchParams.set("puzzle", puzzleIndex + 1);
  const state = window.history.state;
  if (!steps.length && !state?.fraction24 && url.href === location.href) return;
  const attempt = steps.length ? {
    deck: puzzles[puzzleIndex].join("-"),
    moves: steps.map(({left, right, op}) => ({left, right, op}))
  } : null;
  try {
    window.history.replaceState({...state, fraction24: attempt}, "", url);
  } catch {
    // The cards still work in contexts that block history updates.
  }
}

function undo(event) {
  if (history.length === 0) return;
  tiles = history.pop();
  steps.pop();
  selection = [];
  hintedOperator = null;
  message = "已撤销。重新选两张牌。";
  saveAttempt();
  render();
  if (event.detail === 0 && history.length === 0) cardButtons[0].focus();
}

function hint(event) {
  const move = suggestion(tiles);
  if (move === true) return;
  let focusTarget;
  if (!move) {
    const count = undoCountToSolution(history);
    message = "当前牌面无法凑成 24。";
    if (count !== null) {
      message += "撤销 " + count + " 步可回到有解的牌面。";
      focusTarget = $("undo");
    }
  } else {
    const { left, right, op } = move;
    selection = [left, right];
    hintedOperator = op;
    message = "试试 " + operationText(left, right, op) + "。";
    focusTarget = operatorButtons[op];
  }
  render();
  if (event.detail === 0) focusTarget?.focus();
}

function addButton(parent, className, click) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = className;
  button.addEventListener("click", click);
  parent.append(button);
  return button;
}

const cardButtons = suits.map((_, index) => addButton($("cards"), "card", () => selectTile(index)));
const operatorButtons = signs.map((sign, op) => {
  const button = addButton($("operators"), "operator", () => apply(op));
  button.textContent = sign;
  button.setAttribute("aria-label", names[op]);
  return button;
});

function renderProgress() {
  $("progress").textContent = "已过 " + solved.size + " / " + puzzles.length + " 题";
  for (const option of $("puzzle").options) {
    const index = Number(option.value);
    option.textContent = "第 " + (index + 1) + " 题" + (solved.has(index) ? "（已过关）" : "");
  }
}

function render() {
  const won = tiles.length === 1 && isGoal(tiles[0]);
  $("puzzle").value = String(puzzleIndex);
  $("status").textContent = message;
  $("solution").hidden = !won;
  $("solution-expression").textContent = won ? `${tiles[0].expression} = 24` : "";
  $("hint").disabled = won;
  $("undo").disabled = history.length === 0;
  $("reset").disabled = history.length === 0 && selection.length === 0;
  $("steps").replaceChildren(...steps.map(({expression}) => {
    const step = document.createElement("li");
    step.textContent = expression;
    return step;
  }));

  cardButtons.forEach((button, index) => {
    const tile = tiles[index];
    button.hidden = !tile;
    button.disabled = tiles.length === 1 || !tile;
    const order = selection.indexOf(index);
    button.setAttribute("aria-pressed", String(order !== -1));
    if (order < 0) button.removeAttribute("aria-description");
    else button.setAttribute("aria-description", `第 ${order + 1} 个操作数`);
    if (!tile) return;

    const rank = document.createElement("span");
    rank.textContent = value(tile);
    const suit = document.createElement("span");
    suit.className = tile.suit % 2 === 1 ? "suit red" : "suit";
    suit.textContent = suits[tile.suit] ?? "";
    suit.setAttribute("aria-hidden", "true");
    const label = document.createElement("span");
    label.className = "order";
    label.textContent = order < 0 ? "" : String(order + 1);
    label.setAttribute("aria-hidden", "true");
    button.replaceChildren(rank, suit, label);
    button.setAttribute("aria-label", "第 " + (index + 1) + " 张牌，" + value(tile));
  });

  const ready = selection.length === 2;
  const [left, right] = selection;
  operatorButtons.forEach((button, op) => {
    button.disabled = !ready;
    const recommended = op === hintedOperator;
    button.classList.toggle("hinted", recommended);
    if (ready) {
      button.setAttribute("aria-description", (recommended ? "建议计算 " : "计算 ") + operationText(left, right, op));
    } else button.removeAttribute("aria-description");
  });
}

puzzles.forEach((_, index) => {
  const option = document.createElement("option");
  option.value = String(index);
  $("puzzle").append(option);
});
$("puzzle").addEventListener("change", event => reset(Number(event.target.value)));
$("hint").addEventListener("click", hint);
$("undo").addEventListener("click", undo);
$("reset").addEventListener("click", () => reset(puzzleIndex));
$("next").addEventListener("click", () => reset((puzzleIndex + 1) % puzzles.length));
window.addEventListener("storage", event => {
  if (!progressStorage || event.storageArea !== progressStorage) return;
  if (event.key === null) solved.clear();
  else {
    const index = progressKeys.indexOf(event.key);
    if (index === -1) return;
    if (event.newValue === "1") solved.add(index);
    else solved.delete(index);
  }
  renderProgress();
});
const requestedPuzzle = Number(new URLSearchParams(location.search).get("puzzle"));
const validPuzzle = Number.isInteger(requestedPuzzle) && requestedPuzzle >= 1 && requestedPuzzle <= puzzles.length;
const index = validPuzzle ? requestedPuzzle - 1 : 0;
const attempt = window.history.state?.fraction24;
const savedMoves = attempt?.deck === puzzles[index].join("-") && Array.isArray(attempt.moves)
  && attempt.moves.length < puzzles[index].length ? attempt.moves : [];
reset(index, savedMoves);
renderProgress();
</script>
</body>
</html>
