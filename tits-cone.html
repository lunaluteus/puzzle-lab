<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="An interactive view of Tits cones and Coxeter chambers in ranks one to three.">
<title>The Tits Cone · Luna's Puzzle Lab</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f3f1e8;
    --surface: #fdfbf4;
    --ink: #162c32;
    --muted: #4a6267;
    --line: #cbd3cb;
    --accent: #126c60;
    --gold: #e3a549;
    --plot: #14232d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background: var(--paper); font: 1rem/1.5 system-ui, sans-serif; }
  main { width: min(1080px, 100% - 36px); margin: auto; padding: 24px 0 56px; }
  a { color: var(--accent); text-underline-offset: .19em; }
  .page-links { display: flex; gap: 16px; font-size: .875rem; }
  h1 { font: 500 clamp(2.8rem, 8vw, 6rem)/1 Georgia, serif; letter-spacing: -.07em; margin: 14px 0 9px; }
  header p { margin: 0 0 21px; color: var(--muted); }
  .viewer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(226px, 266px); gap: 14px; align-items: start; }
  figure { position: relative; margin: 0; min-width: 0; }
  canvas { display: block; width: 100%; aspect-ratio: 1.16; max-height: min(68vh, 620px); background: var(--plot); border-radius: 12px; cursor: crosshair; touch-action: manipulation; }
  canvas.dual-line { height: 150px; }
  canvas.sphere { cursor: grab; touch-action: none; }
  canvas.sphere[data-dragging="true"] { cursor: grabbing; }
  figcaption { display: flex; gap: 6px 16px; flex-wrap: wrap; padding: 10px 2px 0; color: var(--muted); font-size: .82rem; }
  figcaption span { display: inline-flex; align-items: center; gap: 6px; }
  figcaption i { width: 12px; height: 12px; border: 1px solid #126c60; border-radius: 3px; }
  figcaption .fundamental { background: #47aaa6; }
  figcaption .selected { background: #efb755; border-color: #9e6627; }
  figcaption .limit { border-style: dashed; border-color: #637983; }
  figcaption .sphere-controls { flex-basis: 100%; flex-wrap: wrap; justify-content: space-between; }
  .point-probe { margin: 9px 0 0; color: var(--muted); font-size: .85rem; }
  .probe-controls { display: flex; flex-wrap: wrap; align-items: end; gap: 8px; margin-top: 8px; }
  .probe-controls input { display: block; width: 4.7rem; height: 36px; padding: 5px 6px; font: inherit; color: inherit;
    border: 1px solid #aebdb7; background: var(--surface); border-radius: 7px; }
  .probe-controls button { font-size: .875rem; }
  figcaption [hidden], button[hidden] { display: none; }
  aside { display: grid; gap: 14px; }
  .panel { padding: 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; }
  .panel p { margin: 8px 0 0; color: var(--muted); font-size: .89rem; overflow-wrap: anywhere; }
  label, .field-heading { display: block; font-weight: 650; font-size: .88rem; }
  select, button { font: inherit; color: inherit; }
  select { width: 100%; margin-top: 6px; padding: 8px 6px; }
  select, button { border: 1px solid #aebdb7; background: var(--surface); border-radius: 7px; }
  button { min-height: 36px; padding: 6px 8px; cursor: pointer; }
  button:disabled { opacity: .48; cursor: default; }
  button:enabled:hover, select:hover { border-color: var(--accent); }
  .plot-wall { position: absolute; transform: translate(-50%, -50%); width: 28px; height: 28px;
    min-height: 0; padding: 0; border-color: #9ab3b9; background: #14232d; color: #e2eeee;
    font: 700 .88rem/1 system-ui, sans-serif; }
  .plot-wall:enabled:hover { border-color: #e2eeee; background: #315059; }
  .plot-wall:disabled { opacity: 1; color: #a6b6bd; border-color: #66868d; }
  a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, canvas:focus-visible, summary:focus-visible {
    outline: 3px solid #146d63; outline-offset: 3px;
  }
  .plot-wall:focus-visible { outline-color: #fff6dd; outline-offset: 1px; }
  .depth-label { margin-top: 14px; display: flex; justify-content: space-between; gap: 6px; }
  .projection-control { margin-top: 14px; }
  input[type=range] { width: 100%; margin: 6px 0 0; accent-color: var(--accent); }
  .word {
    color: var(--accent); font: 700 1.6rem/1.25 ui-monospace, monospace;
    margin-top: 3px; overflow-wrap: anywhere;
  }
  .walls, .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .walls button { flex: 1; background: #e2eee6; border-color: #a5beb1; font-size: .875rem; padding-inline: 5px; white-space: nowrap; }
  .tools button { color: var(--muted); font-size: .88rem; }
  #matrix { font-variant-numeric: tabular-nums; }
  details { color: var(--muted); max-width: 820px; margin-top: 16px; padding: 12px 15px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
  details summary { color: var(--ink); cursor: pointer; }
  #notes, #classification { scroll-margin-top: 16px; }
  details h2 { margin: 15px 0 0; color: var(--ink); font-size: 1rem; }
  details p { margin: .75em 0; }
  details ul { padding-inline-start: 1.35em; }
  details li + li { margin-top: .35em; }
  .gallery-route, .gallery-growth { padding: 8px; margin-top: 10px; font-size: .875rem; }
  .route-link { width: 100%; margin-top: 6px; padding: 6px; font: inherit; color: inherit;
    border: 1px solid #aebdb7; background: var(--surface); border-radius: 7px; }
  .gallery-steps { display: flex; flex-wrap: wrap; gap: 4px; list-style: none; margin: 8px 0 0; padding: 0; }
  .gallery-steps li + li { margin: 0; }
  .gallery-steps button { min-width: 32px; font-family: ui-monospace, monospace; }
  .gallery-steps [aria-current="step"] { background: #e2eee6; border-color: var(--accent); font-weight: 700; }
  .growth-scale { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .growth-scale input { margin: 0; accent-color: var(--accent); }
  .growth-chart { display: flex; gap: 2px; height: 60px; margin-top: 6px; border-bottom: 1px solid #aebdb7; }
  .growth-column { position: relative; display: flex; align-items: flex-end; flex: 1 0 0; }
  .growth-column input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .growth-column:hover { background: #eef0e7; }
  .growth-column:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; z-index: 1; }
  .growth-bar { width: 100%; background: #6b9690; border-radius: 2px 2px 0 0; }
  .growth-column input:checked + .growth-bar { background: var(--accent); outline: 1px solid var(--accent); }
  .growth-axis { display: flex; justify-content: space-between; font-size: .75rem; margin-top: 2px; }
  code { font-family: ui-monospace, monospace; font-size: .94em; }
  @media (max-width: 700px) {
    .viewer { grid-template-columns: 1fr; }
    canvas { aspect-ratio: 1.07; max-height: none; }
    aside { grid-template-columns: 1fr 1fr; gap: 8px; }
    .panel { padding: 10px; }
  }
  @media (max-width: 395px) {
    main { width: calc(100% - 22px); padding-top: 18px; }
    aside { grid-template-columns: 1fr; }
  }

  .inspector { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 12px; margin-top: 18px; }
  .data h2 { margin: 0 0 8px; font-size: 1rem; }
  .matrix { padding: 9px; border-radius: 7px; background: #eef0e7; }
  .formula { display: inline-block; max-width: 100%; overflow-wrap: anywhere; vertical-align: middle; }
  .formula svg { max-width: 100%; height: auto; }
  .graph { position: relative; width: 180px; height: 103px; }
  .graph-line { position: absolute; border-top: 1.5px solid var(--accent); transform-origin: left center; }
  .graph-line.dotted { border-top-style: dashed; }
  .graph-node, .graph-weight { position: absolute; transform: translate(-50%, -50%); }
  .graph-node { display: grid; place-content: center; width: 23px; height: 23px; background: #dcece3; border: 1px solid #6c9d8a; border-radius: 50%; font: .91rem Georgia, serif; }
  .graph-weight { background: var(--surface); padding: 0 4px; color: var(--muted); font: .78rem ui-monospace, monospace; }
</style>
  <script type="module" src="./src/coxeter/app.jsx"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
