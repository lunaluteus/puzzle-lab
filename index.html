<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="在浏览器里玩环灯、分数 24 点、三格轮转，探索 Tits 锥。">
<title>Luna 的谜题桌</title>
<style>
  :root { color-scheme: light; --ink: #213931; --muted: #50655b; --paper: #f7f4e9; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 1rem/1.65 system-ui, sans-serif;
  }
  main { width: min(920px, calc(100% - 40px)); margin: 0 auto; padding: clamp(30px, 8vw, 94px) 0 60px; }
  header { border-bottom: 1px solid #bfc8b7; padding-bottom: 20px; }
  h1 { font-size: clamp(2.45rem, 8vw, 5rem); line-height: 1.08; letter-spacing: -.045em; margin: 0; }
  ul {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 310px), 1fr));
    list-style: none;
    padding: 0;
    margin: 24px 0 0;
    gap: 16px;
  }
  li { display: flex; min-width: 0; }
  .puzzle {
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    width: 100%;
    border: 1px solid #cbd3c6;
    background: #fffdf6;
    border-radius: 14px;
    overflow: hidden;
    transition: box-shadow .2s, border-color .2s;
  }
  .puzzle:hover { border-color: #687c6d; box-shadow: 0 5px 16px #182d231a; }
  .puzzle:focus-visible { outline: 3px solid #a94a32; outline-offset: 4px; }
  .illustration { display: grid; place-content: center; min-height: 134px; padding: 18px; }
  .lamp-scene { background: #233026; }
  .card-scene { background: #255044; }
  .tile-scene { background: #463856; }
  .cone-scene { background: #14232d; }
  .cone-fan { width: 105px; aspect-ratio: 1; border-radius: 50%; background: conic-gradient(#60b3a4 0deg 35deg, #efb755 35deg 92deg, #3b8988 92deg 135deg, #315963 135deg 155deg, transparent 155deg 295deg, #315963 295deg 315deg, #3b8988 315deg 360deg); }
  .lamps { display: grid; grid-template-columns: repeat(7, 1fr); gap: clamp(6px, 2vw, 13px); }
  .lamps span {
    width: clamp(16px, 4vw, 26px);
    aspect-ratio: 1;
    background: #3d493c;
    border: 1px solid #747e60;
    border-radius: 50%;
  }
  .lamps span:nth-child(3n + 1), .lamps span:nth-child(5) {
    background: #f5cb75;
    border-color: #f5cb75;
    box-shadow: 0 0 18px #ffc44e44;
  }
  .cards { display: flex; gap: 8px; color: #20392e; }
  .cards span {
    display: grid;
    place-content: center;
    width: 43px;
    height: 57px;
    border-radius: 6px;
    background: #fbf4e5;
    font: 700 1.5rem Georgia, serif;
    box-shadow: 0 2px 0 #142f25;
  }
  .cards span:nth-child(even) { color: #a94331; }
  .tile-scene .cards span { width: 37px; height: 46px; color: #302944; }
  .tile-scene .cards span:nth-child(-n + 3) { background: #ffe3a5; }
  .caption { flex: 1; padding: 17px 19px 20px; }
  h2 { font-size: 1.35rem; margin: 0 0 4px; line-height: 1.3; }
  p { margin: 0; color: var(--muted); }
  footer { margin-top: 24px; font-size: .9rem; }
  footer a { color: var(--muted); text-underline-offset: .18em; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Luna 的谜题桌</h1>
  </header>
  <ul>
    <li>
      <a class="puzzle" href="ring-lamps.html">
        <div class="illustration lamp-scene" aria-hidden="true">
          <div class="lamps"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        </div>
        <div class="caption">
          <h2>环灯</h2>
          <p>每按一次翻转三盏灯。试试用最少的次数把灯全关。</p>
        </div>
      </a>
    </li>
    <li>
      <a class="puzzle" href="fraction-24.html">
        <div class="illustration card-scene" aria-hidden="true">
          <div class="cards"><span>1</span><span>3</span><span>4</span><span>6</span></div>
        </div>
        <div class="caption">
          <h2>分数 24 点</h2>
          <p>四张牌凑成 24。这里的 16 道题都得用上分数。</p>
        </div>
      </a>
    </li>
    <li>
      <a class="puzzle" href="triple-rotate.html">
        <div class="illustration tile-scene" aria-hidden="true">
          <div class="cards"><span>2</span><span>1</span><span>3</span><span>5</span><span>4</span></div>
        </div>
        <div class="caption">
          <h2>三格轮转</h2>
          <p>每次轮转相邻三格，把数字排回原位。</p>
        </div>
      </a>
    </li>
    <li>
      <a class="puzzle" href="tits-cone.html" lang="en">
        <div class="illustration cone-scene" aria-hidden="true"><div class="cone-fan"></div></div>
        <div class="caption">
          <h2>The Tits Cone</h2>
          <p>Reflect Coxeter chambers and compare finite, affine, and hyperbolic examples.</p>
        </div>
      </a>
    </li>
  </ul>
  <footer><a href="https://github.com/lunaluteus/puzzle-lab">GitHub 源码</a></footer>
</main>
</body>
</html>
